name: Publish npm package

# Publish only from version tags: bump package.json + Cargo.toml, then `git tag v0.1.0 && git push --tags`
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the package's Trusted Publisher settings on npmjs.com
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC); also generates provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5.1 is required for trusted publishing
          registry-url: https://registry.npmjs.org/
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./package.json').version")
          cargo_version=$(cargo metadata --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0)).packages[0].version")
          echo "tag=$tag npm=$npm_version cargo=$cargo_version"
          test "$tag" = "$npm_version" && test "$tag" = "$cargo_version"
      - run: npm run build
      - run: npm test
      # No token: npm exchanges the job's OIDC identity for a short-lived publish credential
      - run: npm publish --access public

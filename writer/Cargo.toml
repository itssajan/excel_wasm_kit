[package]
name = "kurama-excel-writer"
version = "0.1.2"
edition = "2021"
description = "Streaming xlsx and CSV writer for @kuramajs/excel, in WebAssembly"
license = "MIT"
repository = "https://github.com/kuramajs/excel"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3.106"
zip = { version = "9", default-features = false, features = ["deflate"] }
csv = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

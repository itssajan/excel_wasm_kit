[package]
name = "kurama-excel"
version = "0.1.2"
edition = "2021"
description = "Fast, low-memory Excel reader for browsers and Node, in WebAssembly"
license = "MIT"
repository = "https://github.com/kuramajs/excel"

[lib]
crate-type = ["cdylib"]

# The writer is its own wasm (writer/), so readers don't download it.
[workspace]
members = ["writer"]


[dependencies]
wasm-bindgen = "0.2"
calamine = "0.37"
js-sys = "0.3.106"
ouroboros = "0.18.5"
csv = "1"
encoding_rs = "0.8"

[dev-dependencies]
rust_xlsxwriter = { version = "0.101.0", features = ["constant_memory"] }


# Speed over size: opt-level "s" is ~8% smaller gzip but ~13% slower (see bench/README.md).
[profile.release]
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[[example]]
name = "gen_bench"
path = "bench/gen.rs"

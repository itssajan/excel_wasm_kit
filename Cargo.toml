[package]
name = "excel-kit"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]


[dependencies]
wasm-bindgen = "0.2"
calamine = "0.37"
js-sys = "0.3.106"
ouroboros = "0.18.5"

[dev-dependencies]
rust_xlsxwriter = { version = "0.101.0", features = ["constant_memory"] }


# Speed over size: opt-level "s" is ~8% smaller gzip but ~13% slower (see bench/README.md).
[profile.release]
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[[example]]
name = "gen_bench"
path = "bench/gen.rs"
